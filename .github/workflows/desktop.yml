# Builds the Line Rush app for Windows, macOS and Linux.
# - Change desktop/package.json on main (bump its "version") or push a tag like v1.0.1 to publish the
#   installers to the GitHub Release v<version>; installed apps update themselves from there.
# - Run it by hand (Actions -> Desktop app -> Run workflow) to just get the installers as artifacts,
#   or tick "publish" to put them in a GitHub Release v<version> (made for you if it doesn't exist).
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   LINE_RUSH_SERVER  the online server the app uses (e.g. https://your-game.up.railway.app)
#   DISCORD_CLIENT_ID a Discord application ID, for "Playing Line Rush" status on Discord
# Optional repository secrets (Settings -> Secrets and variables -> Actions -> Secrets) sign the apps, so Windows
# and macOS name "Line Rush" as the publisher instead of warning about an unknown app. Without them the
# installers are built unsigned, as before. Each one only reaches electron-builder on its own system:
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD  Windows: the code signing certificate (.pfx, base64) and its password
#   CSC_LINK, CSC_KEY_PASSWORD          macOS: the Developer ID Application certificate (.p12, base64) and its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  macOS notarization (needs the certificate above)
name: Desktop app

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['desktop/package.json']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installers to the GitHub Release for desktop/package.json's version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the game
        run: |
          npm ci
          npm run build

      # the tests are the same on every system; once is enough (one of them uses a Unix socket)
      - name: Test
        if: runner.os == 'Linux'
        run: npm test

      - name: App settings for this build
        shell: bash
        env:
          LINE_RUSH_SERVER: ${{ vars.LINE_RUSH_SERVER }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          node -e "
            const fs = require('fs'), p = 'desktop/app-config.json', c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (process.env.LINE_RUSH_SERVER) c.server = process.env.LINE_RUSH_SERVER;
            if (process.env.DISCORD_CLIENT_ID) c.discordClientId = process.env.DISCORD_CLIENT_ID;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      # its own step, so the packages' install scripts never run with a signing secret around
      - name: Install the app's packages
        working-directory: desktop
        run: npm ci

      # electron-builder signs when CSC_LINK / WIN_CSC_LINK are set, so they're only set when the secret exists
      # (an empty one breaks the build) and only on their own system (Windows falls back to CSC_LINK).
      # The other systems' runners never get them.
      - name: Package
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CERT: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CERT_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          MAC_CERT: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          MAC_CERT_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          NOTARIZE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          NOTARIZE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          NOTARIZE_TEAM: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CERT" ]; then
            export WIN_CSC_LINK="$WIN_CERT" WIN_CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
            echo "Signing the Windows app and installer"
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            echo "Signing the macOS app"
            if [ -n "$NOTARIZE_ID" ]; then
              export APPLE_ID="$NOTARIZE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARIZE_PASSWORD" APPLE_TEAM_ID="$NOTARIZE_TEAM"
              echo "...and notarizing it"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false # no certificate: don't look for one in the keychain
          fi
          npm run ${{ (github.event_name == 'push' || inputs.publish) && 'release' || 'dist' }}

      - uses: actions/upload-artifact@v4
        with:
          name: line-rush-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: ignore
